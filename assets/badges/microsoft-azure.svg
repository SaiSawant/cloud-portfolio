<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- Shield Background -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005a9e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield Shape -->
  <path d="M 100 20 L 160 50 L 160 120 Q 100 180 100 180 Q 100 180 40 120 L 40 50 Z" fill="url(#bg-gradient)" stroke="#003d7a" stroke-width="1.5"/>
  
  <!-- Inner Shield -->
  <path d="M 100 28 L 152 55 L 152 118 Q 100 170 100 170 Q 100 170 48 118 L 48 55 Z" fill="#0084d4"/>
  
  <!-- Microsoft Certified Banner -->
  <rect x="50" y="30" width="100" height="18" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="100" y="42" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#0078d4">
    Microsoft
  </text>
  <text x="100" y="55" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#ffffff">
    CERTIFIED
  </text>
  
  <!-- Title -->
  <text x="100" y="85" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Azure Solutions
  </text>
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Architect
  </text>
  
  <!-- Stars (Expert Level) -->
  <g transform="translate(100, 125)">
    <!-- Star 1 -->
    <polygon points="0,-8 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2" fill="#ffffff"/>
    <!-- Star 2 -->
    <polygon points="18,-8 20,-2 26,-2 21,2 23,8 18,4 13,8 15,2 10,-2 16,-2" fill="#ffffff"/>
    <!-- Star 3 -->
    <polygon points="36,-8 38,-2 44,-2 39,2 41,8 36,4 31,8 33,2 28,-2 34,-2" fill="#ffffff"/>
  </g>
  
  <!-- Certification Code -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="bold">
    AZ-305
  </text>
  
  <!-- Additional Info -->
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#e0f0ff">
    Expert Level • Professional Certificate
  </text>
</svg>
