<svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="githubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d333b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c2128;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Pentagon shape (rounded rectangle for badge) -->
  <rect x="30" y="20" width="140" height="140" rx="12" fill="url(#githubGrad)" stroke="#4a5568" stroke-width="2"/>
  <!-- Bottom point -->
  <polygon points="100,160 70,160 85,190 100,200 115,190 130,160" fill="url(#githubGrad)" stroke="#4a5568" stroke-width="2"/>
  
  <!-- GitHub logo (simplified) -->
  <circle cx="100" cy="45" r="8" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <circle cx="95" cy="50" r="3" fill="#8b949e"/>
  <circle cx="105" cy="50" r="3" fill="#8b949e"/>
  
  <!-- Text -->
  <text x="100" y="95" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">GitHub</text>
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">Copilot</text>
  
  <!-- Certification label -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="11" fill="#3fb950" text-anchor="middle" font-weight="bold">Certification</text>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="11" fill="#3fb950" text-anchor="middle" font-weight="bold">Program</text>
</svg>
