<svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d3d3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232f3e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Hexagon shape -->
  <polygon points="100,20 180,70 180,170 100,220 20,170 20,70" fill="url(#hexGrad)" stroke="#a8b0b8" stroke-width="2"/>
  <!-- AWS text -->
  <text x="100" y="85" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">aws</text>
  <!-- Checkmark -->
  <circle cx="155" cy="70" r="12" fill="#FF9900"/>
  <path d="M 150 70 L 153 73 L 160 66" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- certified text -->
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="10" fill="#a8b0b8" text-anchor="middle">certified</text>
  <!-- Line -->
  <line x1="70" y1="115" x2="130" y2="115" stroke="white" stroke-width="1"/>
  <!-- Title -->
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Cloud</text>
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Practitioner</text>
  <!-- Level -->
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" letter-spacing="2">FOUNDATIONAL</text>
</svg>
