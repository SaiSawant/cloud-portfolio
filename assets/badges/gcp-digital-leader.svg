<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gcpGrad)" stroke="#b0b0b0" stroke-width="2"/>
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="white" stroke="#d0d0d0" stroke-width="1.5"/>
  
  <!-- GCP logo (cloud icon) -->
  <g transform="translate(100, 65)">
    <!-- Red part -->
    <path d="M -8 0 Q -12 -5 -8 -10 Q 0 -15 8 -10 L 8 0 Z" fill="#EA4335"/>
    <!-- Yellow part -->
    <path d="M 8 0 Q 12 -5 8 -10 L 8 0 Z" fill="#FBBC04"/>
    <!-- Blue parts -->
    <path d="M -8 0 Q -12 5 -8 10 L -8 0 Z" fill="#4285F4"/>
    <path d="M 8 0 Q 12 5 8 10 L 8 0 Z" fill="#34A853"/>
  </g>
  
  <!-- Text around circle -->
  <path id="circlePath" d="M 30, 100 A 70, 70 0 0, 1 170, 100" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="14" fill="#666" letter-spacing="2" font-weight="bold">
    <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
      Cloud Digital Leader
    </textPath>
  </text>
  
  <!-- Bottom text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" font-weight="bold">GOOGLE CLOUD CERTIFIED</text>
</svg>
