<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Official GitHub & OCI Badge -->
  <defs>
    <linearGradient id="gh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27343e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Badge Shield -->
  <path d="M 100,20 L 170,50 L 170,120 Q 100,170 100,170 Q 100,170 30,120 L 30,50 Z" fill="url(#gh-grad)" stroke="#000000" stroke-width="1"/>
  
  <!-- Ribbon Banner -->
  <rect x="40" y="28" width="120" height="20" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="100" y="42" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#1f2937">GitHub & OCI</text>
  
  <!-- Badge Content -->
  <text x="100" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">CERTIFIED</text>
  
  <!-- Title -->
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#ffffff">Copilot &</text>
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#ffffff">AI Tools</text>
  
  <!-- Stars -->
  <g transform="translate(105, 135)">
    <polygon points="0,-5 1.5,-1 5.5,-1 2.25,1.5 3.75,5.5 0,2 -3.75,5.5 -2.25,1.5 -5.5,-1 -1.5,-1" fill="#ffffff"/>
    <polygon points="15,-5 16.5,-1 20.5,-1 17.25,1.5 18.75,5.5 15,2 11.25,5.5 12.75,1.5 9.5,-1 13.5,-1" fill="#ffffff"/>
  </g>
</svg>
